type Query {
  agenda(from: DateTime!, to: DateTime!): [AgendaDay!]!
  athleteProfile: AthleteProfile!

  """Who did what, and when. Administrators only."""
  audit(action: String, actor: ID, after: String, first: Int = 50, from: DateTime, targetType: String, to: DateTime): AuditConnection!

  """The caller's body metric history."""
  bodyMetrics(last: Int = 30): [BodyMetric!]!
  checkins(from: Date!, to: Date!): [Checkin!]!
  conversations(includeArchived: Boolean = false): [Conversation!]!

  """A member's devices. Administrators only."""
  devicesOf(userId: ID!): [Device!]!

  """Every member’s unfinished links. Administrators only."""
  ingestionQueue(status: LinkStatus): [Link!]!
  labelPalette: [String!]!
  labels(includeDeleted: Boolean): [Label!]!

  """One saved link with its summary and, for a playlist, its videos."""
  link(id: ID!): Link

  """The member’s saved links, newest first."""
  links(after: String, first: Int = 50, kind: LinkKind, status: LinkStatus): LinkConnection!

  """The authenticated member."""
  me: User!

  """The member’s own meals, by name."""
  meals(kind: MealKind): [Meal!]!
  meeting(id: ID!): Meeting
  meetingOccurrences(from: DateTime!, to: DateTime!): [MeetingOccurrence!]!
  meetings(includeCompleted: Boolean): [Meeting!]!
  messages(afterSeq: Int, conversationId: ID!, first: Int = 50): MessageConnection!
  monthOverview(month: Int!, year: Int!): [MonthDay!]!

  """The caller's own registered devices."""
  myDevices: [Device!]!
  nextPractice: NextPractice!
  plans(from: Date!, to: Date!): [DailyPlan!]!

  """The caller's own preferences."""
  preferences: Preferences!

  """The caller's own profile."""
  profile: Profile!
  program(id: ID!): Program
  programs(includeArchived: Boolean): [Program!]!
  quickQuestions(scope: ConversationKind!): [QuickQuestion!]!
  reminder(id: ID!): Reminder
  reminders(cursor: String, limit: Int, view: ReminderViewName!): ReminderPage!

  """Registered machine callers. Administrators only."""
  serviceClients: [ServiceClient!]!
  session(id: ID!): Session
  sessions(from: DateTime!, to: DateTime!): [Session!]!

  """The settings registry. Administrators only."""
  settings: [Setting!]!
  streak: Streak!

  """Session suggestions drawn from the member’s own saved sources."""
  suggestions(status: SuggestionStatus = pending): [Suggestion!]!
  task(id: ID!): Task
  tasks(cursor: String, labelId: ID, limit: Int, view: TaskViewName!): TaskPage!

  """
  The meals chosen for one of the member’s days, or null when none have been.
  """
  todayMeals(date: Date): TodayMeals
  todayPlan(date: Date): DailyPlan!
  tomorrowDraft: DailyPlan!

  """
  Model use by day, kind and model — and by member when asked. Administrators only.
  """
  usage(byMember: Boolean = false, from: Date!, to: Date!, userId: ID): [UsageRow!]!

  """Every member. Administrators only."""
  users(after: String, first: Int = 50, role: Role, search: String, status: UserStatus): UserConnection!
  workouts(sport: String): [Workout!]!
}

