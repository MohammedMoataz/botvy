type BodyMetric {
  bodyFatPct: Float
  heightCm: Float
  note: String
  recordedAt: DateTime!
  weightKg: Float
}

type Checkin {
  adhered: Boolean
  date: Date!
  mood: Int
  note: String
}

type Conversation {
  archived: Boolean!
  clearedUpToSeq: Int!
  createdAt: DateTime!
  id: ID!
  kind: ConversationKind!
  lastMessageAt: DateTime
  pinned: Boolean!
  title: String!
  updatedAt: DateTime!
}

"""The two chats an account comes with, and the ones a member starts."""
enum ConversationKind {
  coach
  free
  planner
}

type DailyPlan {
  autoConfirmed: Boolean!
  briefedAt: DateTime
  confirmedAt: DateTime
  date: Date!
  mealLine: String
  promptedAt: DateTime
  status: PlanStatus!
  summarisedAt: DateTime
  tasks: [PlanTask!]!
  training: PlanTraining
  workoutLine: String
}

"""A calendar date in the member's own time zone, as YYYY-MM-DD."""
scalar Date

"""An instant in time, serialised as an ISO 8601 string in UTC."""
scalar DateTime

type Device {
  hasPush: Boolean!
  id: ID!
  kind: DeviceKind!
  lastSeenAt: DateTime
}

enum DeviceKind {
  android
  chrome_extension
  ios
  web
}

"""
Arbitrary JSON, used for a settings value and an audit entry’s metadata.
"""
scalar JSON

type Label {
  color: String!
  deletedAt: DateTime
  id: ID!
  name: String!
  openTaskCount: Int!
  sortOrder: Int!
  updatedAt: DateTime!
}

type LabelSnapshot {
  color: String!
  name: String!
}

type Message {
  clientId: String
  composedAt: DateTime
  content: String!
  conversationId: ID!
  createdAt: DateTime!
  intent: JSON
  role: MessageRole!
  seq: Int!
}

type MessageConnection {
  endCursor: String
  hasNextPage: Boolean!
  nodes: [Message!]!
}

enum MessageRole {
  assistant
  system
  user
}

"""
What the member decided about a day: proposed and unanswered, agreed, or declined. A day with no plan at all reads as `draft` with no `promptedAt`.
"""
enum PlanStatus {
  confirmed
  draft
  skipped
}

type PlanTask {
  deferCount: Int!
  dueAt: DateTime
  id: ID!
  priority: Int!
  title: String!
}

type PlanTraining {
  sessionId: ID!
  sport: String!
  startAt: DateTime!
  title: String!
}

type Preferences {
  aiSuggestions: Boolean!
  checkinEnabled: Boolean!
  endOfDayTime: String!
  leadTimes: [String!]!
  mealMode: String!
  meetingDurationMin: Int!
  morningBriefingTime: String!
  nextPracticeCutoff: String!
  planTomorrowTime: String!
  quietHours: QuietHours
  userId: ID!
  weekStartsOn: String!
}

type Profile {
  allergies: [String!]
  bmi: Float
  bodyMetrics: [BodyMetric!]!
  displayName: String
  foodDislikes: [String!]
  foodLikes: [String!]
  latestHeightCm: Float
  latestWeightKg: Float
  locale: String!
  onboardingCompletedAt: DateTime
  photoUrl: String
  symptoms: [String!]
  timezone: String!
  userId: ID!
}

type Query {
  """The caller's body metric history."""
  bodyMetrics(last: Int = 30): [BodyMetric!]!
  checkins(from: Date!, to: Date!): [Checkin!]!
  conversations(includeArchived: Boolean = false): [Conversation!]!

  """A member's devices. Administrators only."""
  devicesOf(userId: ID!): [Device!]!
  labelPalette: [String!]!
  labels(includeDeleted: Boolean): [Label!]!

  """The authenticated member."""
  me: User!
  messages(afterSeq: Int, conversationId: ID!, first: Int = 50): MessageConnection!

  """The caller's own registered devices."""
  myDevices: [Device!]!
  plans(from: Date!, to: Date!): [DailyPlan!]!

  """The caller's own preferences."""
  preferences: Preferences!

  """The caller's own profile."""
  profile: Profile!
  quickQuestions(scope: ConversationKind!): [QuickQuestion!]!
  reminder(id: ID!): Reminder
  reminders(cursor: String, limit: Int, view: ReminderViewName!): ReminderPage!

  """Registered machine callers. Administrators only."""
  serviceClients: [ServiceClient!]!

  """The settings registry. Administrators only."""
  settings: [Setting!]!
  streak: Streak!
  task(id: ID!): Task
  tasks(cursor: String, labelId: ID, limit: Int, view: TaskViewName!): TaskPage!
  todayPlan(date: Date): DailyPlan!
  tomorrowDraft: DailyPlan!

  """Every member. Administrators only."""
  users(after: String, first: Int = 50, role: Role, search: String, status: UserStatus): UserConnection!
}

type QuickQuestion {
  id: ID!
  isMine: Boolean!
  mood: String!
  scope: ConversationKind!
  text: String!
}

type QuietHours {
  from: String!
  to: String!
}

type Reminder {
  deletedAt: DateTime
  effectiveAt: DateTime!
  id: ID!
  leadTimes: [String!]!
  remindAt: DateTime!
  snoozedUntil: DateTime
  source: String!
  status: String!
  title: String!
  updatedAt: DateTime!
}

type ReminderPage {
  nextCursor: String
  nodes: [Reminder!]!
}

"""The four reminder lists. `done` carries cancelled ones too."""
enum ReminderViewName {
  deleted
  done
  overdue
  upcoming
}

enum Role {
  admin
  user
}

type ServiceClient {
  createdAt: DateTime!
  id: ID!
  lastUsedAt: DateTime
  name: String!
  revokedAt: DateTime
  scopes: [String!]!
}

type Setting {
  defaultValue: JSON
  description: String!
  key: String!
  readOnly: Boolean!
  value: JSON
}

type Streak {
  best: Int!
  current: Int!
  lastAdheredDate: Date
  weekAdherence: [Boolean]!
}

type Task {
  allDay: Boolean!
  completedAt: DateTime
  deferCount: Int!
  deletedAt: DateTime
  dueAt: DateTime
  estimatedMinutes: Int
  id: ID!
  label: LabelSnapshot
  labelId: ID
  notes: String
  priority: Int!
  recurrenceMode: String
  recurrenceText: String
  repeats: Boolean!
  source: String!
  status: String!
  title: String!
  updatedAt: DateTime!
}

type TaskPage {
  nextCursor: String
  nodes: [Task!]!
}

"""The six task lists, named as the member sees them."""
enum TaskViewName {
  completed
  deleted
  label
  overdue
  today
  upcoming
}

type User {
  createdAt: DateTime!
  deviceCount: Int!
  displayName: String
  email: String!
  id: ID!
  lastLoginAt: DateTime
  role: Role!
  status: UserStatus!
}

type UserConnection {
  endCursor: String
  hasNextPage: Boolean!
  nodes: [User!]!
}

enum UserStatus {
  active
  banned
}