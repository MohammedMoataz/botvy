}

"""
What a row on the agenda is. `prep` is its own kind rather than an attribute of a meeting, because half an hour of preparation is half an hour that is not free (FR-002).
"""
enum AgendaKind {
  event
  meeting
  prep
  session
  task
}

type AgendaKindCounts {
  event: Int!
  meeting: Int!
  prep: Int!
  session: Int!
  task: Int!
}

