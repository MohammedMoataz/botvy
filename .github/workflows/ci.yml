name: CI

on:
  push:
    branches: [main]
  pull_request:

# One file, five independent jobs.
#
# The blueprint listed separate workflow files per surface. The requirement is a
# job per surface, not a file per surface: five jobs in one file give the same
# "one surface red, the others still report" guarantee with less to keep in
# step. Every job carries a timeout, so a run that stops finishing fails the
# build rather than being noticed afterwards.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Mongo is NOT here, deliberately — see "Start MongoDB" below. A `services:`
      # block can pass flags to `docker create` but cannot replace the image's
      # command, and this one has to: a replica set needs `mongod --replSet`.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botvy
          POSTGRES_PASSWORD: botvy
          POSTGRES_DB: botvy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: the action errors with
      # ERR_PNPM_BAD_PM_VERSION when a version is given both here and in the
      # root package.json's packageManager field, even when the two agree.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A replica set of one. The outbox needs transactions and change streams
      # and both require a set, so a plain mongod passes tests that then fail in
      # production.
      #
      # Started here rather than in `services:` because a service container
      # takes `docker create` options but not a command, and `--replSet` is a
      # flag of **mongod**, not of docker. It was declared as a service with a
      # comment calling it a replica set, and the next step's `rs.initiate`
      # answered `This node was not started with replication enabled` — so the
      # backend job has failed on every run since it was written, and the
      # comment was the only replica set in it.
      #
      # `--bind_ip_all` and the command line match `infra/docker-compose.yml`,
      # so what CI exercises is what runs.
      - name: Start MongoDB as a replica set
        run: |
          set -euo pipefail
          docker run -d --name mongo -p 27017:27017 mongo:8 \
            mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval \
            'try { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) } catch (e) { if (!String(e).includes("already initialized")) throw e }'
          # Proves the set is actually usable rather than merely initiated: a
          # write needs a primary, and election takes a moment after initiate.
          for attempt in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({hello:1}).isWritablePrimary' | grep -q true; then
              echo "replica set primary after ${attempt} attempts"; exit 0
            fi
            sleep 2
          done
          echo "the replica set never elected a primary"; exit 1
      - run: pnpm lint
      # The cross-context rule enumerates every context name, so a context added
      # without its twelve patterns is unpoliced and nothing goes red — which is
      # exactly what happened to `meetings` for a phase. The list is generated
      # from the directory listing now; this is the step that notices when the
      # committed config and the tree have parted company.
      - run: pnpm lint:contexts
      # Formatting, so the argument happens once here rather than once per pull
      # request. Markdown and the generated files are out — `.prettierignore`
      # says why each one is.
      - run: pnpm format:check
      - run: pnpm --filter @botvy/backend exec tsc --noEmit -p tsconfig.json
      - run: pnpm --filter @botvy/backend build
      # `tsc` and `vitest` both run against source, and vitest supplies its own
      # CommonJS interop. Three defects have shipped or nearly shipped because
      # the artefact the tests exercise is not the artefact that runs — the one
      # that got furthest was `import { RRule } from 'rrule'`, which type-checked,
      # passed 608 tests and was `undefined` under plain Node. This imports the
      # built output the way the container does. Seconds, no Docker.
      - run: node infra/verify-esm.mjs
      - name: Test
        run: pnpm --filter @botvy/backend test
        env:
          # Named, so the store-backed halves of the repository contract run
          # here rather than skipping. A contract test that quietly stops
          # exercising the real driver still reports green.
          DATABASE_URL: postgresql://botvy:botvy@localhost:5432/botvy
          MONGO_URL: mongodb://localhost:27017/botvy_test?replicaSet=rs0&directConnection=true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botvy/tokens build
      # And the SDK. `@botvy/frontend` imports `@botvy/sdk`, which resolves
      # through its `exports` map to `dist/` — absent in a fresh checkout, so
      # the build failed with eight copies of "Module not found: Can't resolve
      # '@botvy/sdk'". It passes locally because `dist/` is already on disk.
      #
      # Third place this bit: the `extension` job below has carried the line
      # since P9, `frontend/Dockerfile` has a comment about it, and neither this
      # job nor `release.yml` had it. Any job that builds a surface needs it.
      - run: pnpm --filter @botvy/sdk build
      - run: pnpm --filter @botvy/frontend build

  extension:
    name: extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botvy/tokens build
      # The SDK is built rather than pointed at source: the extension imports
      # `@botvy/sdk` through its `exports` map, which names `dist`.
      - run: pnpm --filter @botvy/sdk build
      - run: pnpm --filter @botvy/extension test
      - run: pnpm --filter @botvy/extension exec tsc --noEmit -p tsconfig.json
      - run: pnpm --filter @botvy/extension build
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/.output/*
          if-no-files-found: warn

  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The portal is tested against the whole stack rather than against a
      # Next.js server on its own. Every act this suite performs is refused or
      # allowed by the API — the last-administrator rule, the settings
      # registry's own schema, the audit trail — so a portal with nothing
      # behind it would fail every case for reasons that say nothing about the
      # portal. Ollama and n8n are left out: no case here asks the model
      # anything, and the automation page is required to say plainly when the
      # tool is absent, which is one of the cases.
      - name: Write the environment
        run: |
          cp infra/.env.example .env
          secret() { node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"; }
          {
            echo "POSTGRES_PASSWORD=ci-postgres"
            echo "DATABASE_URL=postgresql://botvy:ci-postgres@postgres:5432/botvy"
            echo "JWT_ACCESS_SECRET=$(secret)"
            echo "JWT_REFRESH_SECRET=$(secret)"
            echo "INTERNAL_SERVICE_TOKEN=$(secret)"
            echo "AUTOMATION_WEBHOOK_SECRET=$(secret)"
            echo "MEDIA_SIGNING_SECRET=$(secret)"
            echo "ADMIN_EMAIL=ci-owner@example.invalid"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "EDGE_PORT=8088"
          } >> .env
          # One generated password, written to the stack and to the suite from
          # the same variable. Two copies are two things to change, and the
          # failure when they disagree is a 401 that looks like a broken login
          # page rather than a mismatched fixture.
          echo "BOTVY_E2E_PASSWORD=${ADMIN_PASSWORD}" >> "$GITHUB_ENV"
        env:
          ADMIN_PASSWORD: ci-${{ github.run_id }}-Owner!

      - name: Start the stack
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --build caddy

      # Why the stack did not come up, in the run that failed.
      #
      # Without this the job reported only `container botvy-v2-backend-1 is
      # unhealthy` and the reason died with the runner, so the failure could be
      # seen on every run and diagnosed on none. `/health` always answers 200,
      # so "unhealthy" means the process was not answering at all — which is
      # exactly the case whose explanation is in its own log.
      - name: Why it did not start
        if: failure()
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml ps -a || true
          for service in backend postgres mongo caddy frontend; do
            echo "::group::${service}"
            docker compose --env-file .env -f infra/docker-compose.yml logs --tail 120 "${service}" || true
            echo "::endgroup::"
          done

      - name: Wait for the edge
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/health > /dev/null; then
              echo "up after ${attempt} attempts"; exit 0
            fi
            sleep 5
          done
          echo "the stack never answered"; exit 1

      # Migrations, and then the restart that lets the seeds see them.
      #
      # Without this the stack came up against an empty database and every
      # sign-in answered 500, so thirteen of nineteen cases failed on one line
      # of a shared helper. It was invisible while the job died earlier, at
      # "backend is unhealthy" — a first install that could not boot at all
      # never got far enough to show that it also had no schema.
      #
      # `infra/bootstrap.mjs` is the supported path and is deliberately not used
      # here: it also imports the automation workflows, and this job does not
      # run n8n — `up -d caddy` brings up only what the edge depends on. It would
      # fail on a service that is absent on purpose. These are the same two
      # commands it runs (`infra/bootstrap.mjs:116-126`), and the restart is the
      # same one, for the same reason: the seeds run at boot, so they need a
      # boot that happens after the tables exist.
      - name: Apply the migrations
        run: |
          set -euo pipefail
          compose() { docker compose --env-file .env -f infra/docker-compose.yml "$@"; }
          compose exec -T backend node_modules/.bin/prisma migrate deploy \
            --schema prisma/schema.prisma
          compose exec -T backend node_modules/.bin/migrate-mongo up \
            -f migrate-mongo-config.cjs
          compose restart backend
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/health > /dev/null; then
              echo "seeded and answering after ${attempt} attempts"; exit 0
            fi
            sleep 5
          done
          echo "the API never came back after the restart"; exit 1

      - run: pnpm --filter @botvy/frontend exec playwright install --with-deps chromium

      # A job that has gone quiet, on purpose. SC-001 is that the overview names
      # it, and the only way to see that is to have one — waiting fifteen
      # minutes for a real job to go stale is not a test, it is a delay.
      - name: Seed a job that stopped
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml exec -T mongo             mongosh botvy --quiet --eval '
              // The job name is the _id: one row per job, and an upsert that
              // keyed on anything else would grow a second row per run.
              const longAgo = new Date(Date.now() - 6 * 60 * 60 * 1000);
              db.ops_heartbeats.updateOne(
                { _id: "ci.stopped" },
                { $set: { lastRunAt: longAgo, lastOkAt: longAgo, lastError: "seeded stale" } },
                { upsert: true },
              );

              // And lift the rate limits for the run.
              //
              // `limits.anonymousPerMinute` is twenty, deliberately: sign-in,
              // registration and the refresh exchange are the routes with no
              // principal behind them, and that is the credential-stuffing
              // limit. A suite of twenty cases that each sign in as the same
              // administrator reaches it, and then fails on a `429` that is the
              // platform working — which is a red line that teaches whoever
              // sees it to ignore red. Zero means unlimited, and it is set on
              // the throwaway stack this job builds rather than in the product.
              for (const key of [
                "limits.anonymousPerMinute",
                "limits.restPerMinute",
                "limits.graphqlPerMinute",
              ]) {
                db.settings.updateOne(
                  { _id: key },
                  { $set: { value: 0, updatedAt: new Date(), updatedBy: "system" } },
                  { upsert: true },
                );
              }
            '

      - name: The operator's acts
        run: pnpm --filter @botvy/frontend test:e2e
        env:
          BOTVY_E2E_URL: http://127.0.0.1:8088
          BOTVY_E2E_EMAIL: ci-owner@example.invalid
          BOTVY_E2E_STALE_JOB: ci.stopped

      # Whatever the suite did, the containers' own account of it. A red run
      # whose only evidence is a browser screenshot leaves the question of
      # which side failed open.
      - name: What the stack said
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --tail 200 backend frontend caddy

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portal-traces
          path: frontend/test-results/**
          if-no-files-found: ignore

  packages:
    name: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botvy/tokens build
      - run: pnpm --filter @botvy/sdk test

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Generate the drift database
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyse
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        # The migration ladder harness lives here. A schema bump without its
        # branch bricks every existing install, so this is the test that has to
        # fail in CI rather than on someone's phone.
        run: flutter test
      - name: Build the debug APK
        working-directory: mobile
        run: flutter build apk --debug --flavor dev
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
