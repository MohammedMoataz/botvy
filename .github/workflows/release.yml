name: Release

on:
  push:
    tags: ['v*']

# A tag builds images, an APK and an extension zip, then deploys — if this
# repository has somewhere to deploy to. The deploy job is gated on the secret
# rather than assumed, so a fork or a clone can cut a release without owning a
# host, and the run reports green rather than red for a step it was never meant
# to take.

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A Docker image reference may not contain capitals, and an owner name
      # freely can. Using `github.repository_owner` verbatim fails the push with
      # "invalid reference format", which reads like a malformed tag rather than
      # a capital letter.
      - name: Lowercase the image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          # Both the tag and `latest`. Compose pins BOTVY_TAG to the exact tag,
          # so `latest` is for a human pulling by hand, never for the deploy.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/botvy-backend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/botvy-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/botvy-frontend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/botvy-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built and published like the others, so a deploy host can `pull` it
      # rather than needing the repository checked out to build it.
      - name: Backup sidecar image
        uses: docker/build-push-action@v6
        with:
          context: infra
          file: infra/backup/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/botvy-backups:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/botvy-backups:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  artifacts:
    name: app and extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botvy/tokens build
      - run: pnpm --filter @botvy/extension build
      - run: pnpm --filter @botvy/extension exec wxt zip

      - name: Release APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --flavor prod --release
        env:
          # Baked at build time. The release phase decides whether an installer
          # can point a published build at their own host instead.
          BOTVY_BASE_URL: ${{ vars.BOTVY_BASE_URL }}

      - name: Attach both to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/mobile/build/app/outputs/flutter-apk/*.apk
            apps/extension/.output/*.zip
          fail_on_unmatched_files: false

      # Publishing to the Chrome Web Store is optional and off by default.
      #
      # Behind a repository *variable* rather than only the secrets, so that a
      # fork or a self-hoster who has the secrets set for something else does
      # not start publishing to a store listing they do not own. The step is
      # skipped silently when the variable is unset, which is the ordinary case:
      # the zip on the release is what most installations use.
      - name: Publish to the Chrome Web Store
        if: vars.CHROME_WEB_STORE_PUBLISH == 'true'
        working-directory: apps/extension
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          zip=$(ls .output/*.zip | head -n 1)
          token=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -s -f -X PUT \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -T "$zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID"
          curl -s -f -X POST \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish"


  deploy:
    name: deploy
    needs: [images, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skipped cleanly where no host is configured, rather than failing.
    if: ${{ vars.DEPLOY_HOST != '' }}
    steps:
      - name: Pin the tag and pull
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/botvy
            # The deployed version is a line in .env, which is also what makes
            # a rollback a one-line edit: re-pin the previous tag and pull.
            # Images are immutable, so the old one is still there.
            sed -i "s/^BOTVY_TAG=.*/BOTVY_TAG=${{ github.ref_name }}/" .env
            docker compose --env-file .env -f infra/docker-compose.yml pull
            docker compose --env-file .env -f infra/docker-compose.yml up -d
            node infra/bootstrap.mjs
            node infra/verify.mjs
