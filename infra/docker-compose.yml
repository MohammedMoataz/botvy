# The whole platform. One published port, everything else on the Docker network.
#
# Principle V is the shape of this file: `caddy` is the only service with a
# `ports:` entry reaching beyond loopback. n8n binds to 127.0.0.1 so the Owner
# can reach its editor through an SSH tunnel without it being on the internet —
# which the principle permits, and which `verify.mjs` excludes when it counts
# public ports.
#
# The stores are managed services by default — Identity on a hosted PostgreSQL
# (Neon), everything else on a hosted MongoDB replica set (Atlas) — reached by
# the two URLs in `.env` and nothing else. The `postgres` and `mongo` services
# below still exist behind `--profile local-stores`: CI runs them, and an Owner
# who would rather keep the data on this machine can too, with the two URLs
# pointed at the container names. Everything that depends on them says
# `required: false`, which Compose (2.20+) reads as "wait for it if it is
# enabled, ignore it if it is not" — the same file serves both installs.

# v2 is its own compose project.
#
# v1's compose file also declares `name: botvy`, which made the two one
# project sharing `pg_data` and `n8n_data` — so v2 came up serving v1's live
# database, and neither stack could run while the other did. The plan had
# accounts carrying over in that shared store; the Owner chose a clean start
# instead, which removes the reason to share it at all.
#
# Renaming the project namespaces every volume (`botvy-v2_pg_data`), so v1's
# data is left exactly where it is and remains recoverable.
name: botvy-v2

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?set it in .env}
  MONGO_URL: ${MONGO_URL:?set it in .env}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set it in .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set it in .env}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set it in .env}
  AUTOMATION_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:?set it in .env}
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?set it in .env}
  MEDIA_DIR: /data/media
  N8N_URL: http://n8n:5678
  N8N_API_KEY: ${N8N_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # The only service publishing beyond loopback.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${EDGE_PORT:-80}:80'
    environment:
      # A bare ":80" serves plain HTTP behind the tunnel, which terminates TLS.
      # Set it to a hostname to have Caddy get its own certificate instead.
      CADDY_SITE: ${CADDY_SITE:-:80}
      # The content security policy. `on` by default since it was verified
      # against a real browser on every portal screen and the public page — nine
      # pages, zero violations, in both modes (E-025). `off` sends it as
      # report-only, which is the way back if a page ever needs one. Read by the Caddyfile, which tells the web app which header
      # name to send; see `frontend/middleware.ts` for the policy itself.
      CSP_ENFORCE: ${CSP_ENFORCE:-on}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [botvy]

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: ghcr.io/${GITHUB_OWNER:-botvy}/botvy-frontend:${BOTVY_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Same-origin through Caddy; the browser never learns the backend's name.
      NEXT_PUBLIC_API_BASE: ''
    networks: [botvy]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ghcr.io/${GITHUB_OWNER:-botvy}/botvy-backend:${BOTVY_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *backend-env
      BOTVY_ROLE: backend
      PORT: 8080
    volumes:
      - media:/data/media
      - ${FIREBASE_CREDENTIALS_DIR:-./secrets}:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [botvy]

  # Same image, different role. The worker has no HTTP edge beyond /healthz.
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ghcr.io/${GITHUB_OWNER:-botvy}/botvy-backend:${BOTVY_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *backend-env
      BOTVY_ROLE: worker
      WORKER_PORT: 8081
    volumes:
      - media:/data/media
      - ${FIREBASE_CREDENTIALS_DIR:-./secrets}:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    healthcheck:
      # Marking the worker healthy on process start would hide a dead relay,
      # which is the one thing this container exists to run.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks: [botvy]

  postgres:
    # Debian, not Alpine, and deliberately so: this is the data directory v1
    # initialised, and v1 ran `postgres:16`. An Alpine build is musl, a Debian
    # build is glibc, and their text collations are not the same — the server
    # says so on every connection, and the mismatch is enough to make
    # CREATE DATABASE fail outright:
    #
    #   WARNING:  database "botvy" has no actual collation version, but a version was recorded
    #   ERROR:  template database "template1" has a collation version, but no
    #           actual collation version could be determined
    #
    # An index built under one collation is not valid under the other, so this
    # matters well beyond the warning. Identity carries over in this same
    # database, which is the whole reason the store is shared; the image has to
    # match the bytes on disk.
    image: postgres:16
    restart: unless-stopped
    # Only with `--profile local-stores`; the default install reaches a managed
    # PostgreSQL through DATABASE_URL and never starts this container.
    profiles: [local-stores]
    environment:
      # Defaults rather than `:?`, for the reason the cloudflared service gives
      # below: a required variable is interpolated by `compose config` whether
      # or not the profile is on, so demanding these would fail the gate on
      # every host that uses a managed store and has no reason to set them.
      # The image refuses to initialise with an empty password loudly enough.
      POSTGRES_USER: ${POSTGRES_USER:-botvy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-botvy}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-botvy} -d ${POSTGRES_DB:-botvy}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [botvy]

  mongo:
    image: mongo:8
    restart: unless-stopped
    # Only with `--profile local-stores`; the default install reaches a managed
    # replica set through MONGO_URL and never starts this container.
    profiles: [local-stores]
    # A replica set of one. Not optional: transactions and change streams both
    # need one, and the outbox needs both.
    # `--quiet` and a high `slowms`, because MongoDB's slow-query log prints the
    # *command document* — so an ordinary task write on a slow disk put the
    # member's title, their notes and their email address into the container
    # log, which P11's scrubbing pass found on its first run against a live
    # stack. Community has no log redaction (`redactClientLogData` is an
    # Enterprise parameter), so raising the threshold is the knob that exists:
    # nothing ordinary logs, and what remains is an operation slower than thirty
    # seconds, on a host only the Owner can read. Recorded in
    # `docs/security-review.md` with that residual stated rather than implied.
    command:
      [
        'mongod',
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--quiet',
        '--slowms',
        '30000',
      ]
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-replica.sh:/scripts/init-replica.sh:ro
    healthcheck:
      # Initiates the set on first boot and is a plain status read afterwards,
      # so the healthcheck is also the thing that makes the set exist.
      test: ['CMD', 'bash', '/scripts/init-replica.sh']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [botvy]

  # Both stores, one sidecar.
  #
  # Restoring Identity without the Mongo side leaves accounts whose data is
  # gone, and the other way round leaves data whose accounts are: `userId` in
  # Mongo is the PostgreSQL uuid and there is no join to rebuild the link from.
  # A host that dumps only one store is not backed up, so both scripts run here
  # on one schedule.
  backups:
    build:
      context: .
      dockerfile: backup/Dockerfile
    image: ghcr.io/${GITHUB_OWNER:-botvy}/botvy-backups:${BOTVY_TAG:-local}
    restart: unless-stopped
    environment:
      MONGO_URL: ${MONGO_URL:?set it in .env}
      DATABASE_URL: ${DATABASE_URL:?set it in .env}
      # How the job's outcome reaches ops_heartbeats: this container is the one
      # part of the platform the API does not run, so it reports over HTTP.
      BOTVY_API_BASE: http://backend:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set it in .env}
      # Only the value used when the API cannot be reached to ask for the real
      # one. The pruning window is `backup.retentionDays` in the settings
      # registry, which the report endpoint answers with — a knob an operator
      # edits from the portal, not a second copy here that they cannot.
      BACKUP_RETENTION_FALLBACK: ${BACKUP_RETENTION_FALLBACK:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      # The same schedule in minutes, reported with the run so `/health` judges
      # the backup's silence by its own cadence (E-018). Change it with
      # BACKUP_CRON or the backup reports a pulse it does not have.
      BACKUP_EVERY_MINUTES: ${BACKUP_EVERY_MINUTES:-1440}
    volumes:
      # A host directory, so the archives survive `docker compose down -v` and
      # can be pointed at another disk. Everything else this project stores
      # lives in a named volume, which is exactly where a backup must not be.
      - ${BACKUP_DIR:-../backups}:/backups
      # Read-only: this container copies the media and must never be able to
      # change what it is copying.
      - media:/data/media:ro
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        # cron hands a job almost no environment, so the variables go into the
        # crontab as assignment lines, which cron reads literally. Dumping the
        # environment to a file and sourcing it would need every value quoted
        # correctly, and a password with a space in it would break the job.
        {
          echo 'SHELL=/bin/bash'
          echo 'PATH=/usr/local/bin:/usr/bin:/bin'
          for name in MONGO_URL DATABASE_URL BOTVY_API_BASE INTERNAL_SERVICE_TOKEN BACKUP_RETENTION_FALLBACK BACKUP_EVERY_MINUTES; do
            echo "$${name}=$${!name}"
          done
          # Redirected to PID 1's stdout, which is this container's log. cron
          # mails a job's output, there is no mailer here, and without this a
          # failed backup would leave no trace anywhere at all.
          echo "$${BACKUP_CRON} root /usr/local/bin/backup.sh >/proc/1/fd/1 2>&1"
        } > /etc/cron.d/botvy-backups
        chmod 0644 /etc/cron.d/botvy-backups
        exec cron -f
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    networks: [botvy]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # Loopback only. Principle V permits localhost; the Owner reaches the editor
    # through an SSH tunnel. Settable, or removable entirely on a host where
    # v1's n8n already holds this port.
    ports:
      - '${N8N_BIND:-127.0.0.1:5679}:5678'
    environment:
      # SQLite in its own volume. It used to share the Postgres container in a
      # second database, and that container is now optional — and there is no
      # reason to hand a managed Identity store the workflow tool's execution
      # log. Principle II reads the same: one credential, no member data.
      DB_TYPE: sqlite
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Cairo}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      # `$env` in a node expression, which n8n blocks by default.
      #
      # Every execution of both cron workflows failed with
      # `ExpressionError: access to env vars denied` until this was set, so the
      # sweep and the rhythm tick had never once fired from n8n. P0's gate
      # caught it — `verify.mjs` reports a job stale after fifteen minutes, and
      # that check is the only reason anybody found out.
      #
      # The default is a sensible one for a shared n8n where anybody can write a
      # workflow: an expression that can read the process environment can read
      # every secret in it. It is the wrong default *here* because this instance
      # runs three workflows, all committed to this repository and imported by
      # `bootstrap.mjs`, and its whole reason for holding the token in the
      # environment is principle II — one credential, no data in n8n's own
      # database. Turning this off would mean storing a second copy of the
      # service token as an n8n credential, which is the thing principle II
      # exists to prevent.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      # Both secrets come from the same .env the API reads, as environment.
      # Never a second credential stored in n8n's own database, so principle
      # II's "one credential and no data" still reads true.
      #
      # `BOTVY_SERVICE_TOKEN` as well as `BOTVY_INTERNAL_TOKEN`, and the same
      # value: the two cron workflows were written against the first name and
      # `error_handler.json` against the second. One of them was always going to
      # be empty, and an empty `Bearer ` is a 401 that looks like nothing. Both
      # names are provided rather than one being renamed, because renaming a
      # variable a committed workflow reads is a change that breaks silently on
      # an installation whose n8n database still holds the old import.
      BOTVY_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set it in .env}
      BOTVY_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set it in .env}
      BOTVY_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:?set it in .env}
      BOTVY_API_BASE: http://backend:8080
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [botvy]

  # A tunnel with no Cloudflare account, for showing somebody the running
  # installation without setting one up. v1 had this beside its named tunnel
  # and the v2 rewrite dropped it, which left "let me send you a link" needing a domain, a login
  # and a token.
  #
  #   docker compose --env-file .env -f infra/docker-compose.yml --profile quick up -d
  #   docker compose --env-file .env -f infra/docker-compose.yml logs cloudflared-quick
  #
  # The hostname is printed in those logs and is **random and temporary**: it
  # changes every time the container starts, and Cloudflare may withdraw it. So
  # it is for a demonstration, never for a client — the phone bakes its gateway
  # URL in, and a quick tunnel would break every install the next morning.
  #
  # `restart: "no"` on purpose, and it is the one line that differs from v1's.
  # `unless-stopped` brings the tunnel back after a reboot **on a different
  # hostname**, so the link somebody was given goes dead while the service reads
  # as healthy. Not coming back is the honest failure of the two.
  #
  # It points at caddy rather than at the backend: constitution V says there is
  # one public surface, and it is the same one whether the request arrives from
  # the LAN or from Cloudflare. Tunnelling the backend directly would put the
  # portal and the read edge on different paths and skip the edge's own rules.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    restart: 'no'
    profiles: [quick]
    command: ['tunnel', '--no-autoupdate', '--url', 'http://caddy:80']
    depends_on:
      caddy:
        condition: service_started
    networks: [botvy]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [tunnel]
    # Not `${TUNNEL_TOKEN:?}`, even though it is required to run this service.
    # A required variable is interpolated by `compose config` regardless of
    # profile, so demanding it here would make the verification gate — which
    # reads `config` to count published ports — fail on every host that does not
    # use a tunnel. cloudflared refuses an empty token loudly enough.
    command:
      ['tunnel', '--no-autoupdate', 'run', '--token', '${TUNNEL_TOKEN:-}']
    depends_on:
      caddy:
        condition: service_started
    networks: [botvy]

networks:
  botvy:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  n8n_data:
  media:
  caddy_data:
  caddy_config:
