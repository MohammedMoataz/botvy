name: botvy
description: Botvy mobile client — local-first assistant for the self-hosted platform.
publish_to: 'none'
# versionName+versionCode. Bump the build number on EVERY release build:
# Android compares versionCode, so two APKs sharing it can silently fail to
# replace each other and leave an old build installed.
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # en + ar with the Material/Cupertino strings and the RTL direction that
  # comes with the locale.
  flutter_localizations:
    sdk: flutter

  # State management (locked decision, v2).
  flutter_bloc: ^9.0.0

  # Navigation (locked decision).
  go_router: ^18.0.0

  # Service locator, so widgets never construct their collaborators.
  get_it: ^8.0.0

  # Theme built from the generated design tokens.
  flex_color_scheme: ^8.0.0

  # HTTP (locked decision). Streaming chat moved to Socket.IO in v2.
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # JWTs, the signed-in email and the gateway URL. The URL is not a secret,
  # but it is one short string and this package is already here — a second
  # storage package for it would be all cost.
  flutter_secure_storage: ^9.2.2

  # Offline cache + outbox, typed queries, and a migration mechanism we would
  # otherwise hand-roll.
  drift: ^2.34.0
  drift_flutter: ^0.2.7

  # On-device notifications: the point of the local-first design is that a
  # reminder fires with no network, no server and no Google reachability.
  flutter_local_notifications: ^19.4.0
  # zonedSchedule needs a TZDateTime; flutter_timezone gives the IANA name of
  # the zone the handset is actually in.
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # Push is the fallback for what the device could not schedule itself.
  # firebase_core is a hard peer of firebase_messaging.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Client-minted ids: what makes a retried create a no-op.
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.13
  # Generates the typed REST client from packages/contracts/openapi.json.
  # Wired up by a build.yaml once the contract is generated (P0 backend work).
  swagger_dart_code_generator: ^3.0.1
  # The migration ladder test hand-builds a database before drift opens it.
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true
