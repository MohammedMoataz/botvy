name: botvy
description: Botvy mobile client for the self-hosted assistant gateway.
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (locked decision).
  flutter_riverpod: ^2.6.1

  # HTTP + SSE streaming (locked decision).
  dio: ^5.7.0

  # JWT + base-URL persistence (locked decision). Also used for the server
  # base URL so we don't need a second storage package for one string.
  flutter_secure_storage: ^9.2.2

  # Push (locked decision). firebase_core is a hard peer of firebase_messaging.
  # Both stay inert until BOTVY_PUSH is defined -- see lib/src/push.dart.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
